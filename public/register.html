<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register Team · ROWDY BOYS</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .pay-qr{background:#fff;padding:14px;border-radius:12px;text-align:center;max-width:280px;margin:12px auto}
  .pay-qr img{max-width:240px;margin:0 auto;border-radius:8px}
  .pay-qr .upi-id{font-family:monospace;font-size:14px;font-weight:800;color:#111;margin-top:8px}
  .pay-info{background:rgba(255,138,0,.08);border:1px solid rgba(255,138,0,.3);
            border-radius:10px;padding:12px;font-size:13px;line-height:1.6;margin:10px 0}
</style>
</head>
<body>
<main class="container">
  <h1 class="page-title">Register Your Team</h1>
  <p class="page-sub">Fill in the form below to enter the tournament</p>
  <div id="wrap">Loading…</div>
</main>

<script src="/js/common.js"></script>
<script>
renderNav('/register');
renderFooter();

const params = new URLSearchParams(location.search);
let preselectedT = params.get('t') ? parseInt(params.get('t')) : null;
let currentType = 'solo';
let currentTournament = null;

async function load() {
  const wrap = document.getElementById('wrap');
  try {
    const tourneys = await API.get('/api/tournaments?status=registration_open');
    if (!tourneys.length) {
      wrap.innerHTML = emptyHTML('🚫','REGISTRATION CLOSED','No tournament is currently accepting registrations.');
      return;
    }

    const pickT = preselectedT && tourneys.find(x=>x.id===preselectedT) ? preselectedT : tourneys[0].id;
    currentTournament = tourneys.find(t => t.id === pickT);

    wrap.innerHTML = `
      <form id="regForm" class="card" style="max-width:640px;margin:0 auto">
        <div class="form-group">
          <label>Tournament</label>
          <select id="tournament_id" required>
            ${tourneys.map(t=>`<option value="${t.id}" ${t.id===pickT?'selected':''}>${esc(t.name)} (${esc(t.mode.toUpperCase())})${t.entry_fee>0?` — ₹${t.entry_fee}`:' — FREE'}</option>`).join('')}
          </select>
        </div>

        <div class="form-group">
          <label>Team Type</label>
          <div class="type-picker" id="typePicker">
            <button type="button" data-type="solo">SOLO · 1</button>
            <button type="button" data-type="duo">DUO · 2</button>
            <button type="button" data-type="squad">SQUAD · 4</button>
          </div>
          <input type="hidden" id="type" value="solo">
        </div>

        <div class="form-group">
          <label>Team Name</label>
          <input id="teamName" maxlength="60" required placeholder="e.g. ROWDY WARRIORS">
        </div>

        <div id="players"></div>

        <div class="form-group">
          <label>Contact (WhatsApp)</label>
          <input id="contact" maxlength="40" required placeholder="+91 ...">
        </div>

        <div class="form-group">
          <label>Team Logo (optional, max 2MB)</label>
          <input type="file" id="logo" accept="image/png,image/jpeg,image/webp,image/gif">
        </div>

        <div id="paymentSection"></div>

        <button class="btn btn-primary" type="submit" style="width:100%" id="submitBtn">Register Team</button>
      </form>
    `;

    setupTypePicker();
    renderPlayers('solo');
    await renderPaymentSection(pickT);

    document.getElementById('tournament_id').addEventListener('change', async e => {
      currentTournament = tourneys.find(t => t.id === parseInt(e.target.value));
      await renderPaymentSection(parseInt(e.target.value));
    });
    document.getElementById('regForm').addEventListener('submit', submit);

  } catch (e) {
    wrap.innerHTML = emptyHTML('⚠️','Failed to load', e.message);
  }
}

function setupTypePicker() {
  const picker = document.getElementById('typePicker');
  picker.addEventListener('click', e => {
    const btn = e.target.closest('button[data-type]');
    if (!btn) return;
    renderPlayers(btn.dataset.type);
  });
}

function renderPlayers(type) {
  currentType = type;
  document.getElementById('type').value = type;
  document.querySelectorAll('#typePicker button').forEach(b =>
    b.classList.toggle('active', b.dataset.type === type));

  const count = { solo: 1, duo: 2, squad: 4 }[type];
  const container = document.getElementById('players');
  const labels = type === 'solo' ? ['Player'] : ['Player 1','Player 2','Player 3','Player 4'].slice(0, count);

  container.innerHTML = labels.map((lbl, i) => `
    <div class="player-block">
      <h4>${lbl.toUpperCase()}</h4>
      <div class="player-fields">
        <input data-i="${i}" data-f="name" placeholder="Name" required maxlength="40">
        <input data-i="${i}" data-f="uid" placeholder="UID" required maxlength="30">
      </div>
    </div>`).join('');
}

async function renderPaymentSection(tid) {
  const el = document.getElementById('paymentSection');
  const tourney = currentTournament;
  if (!tourney || !tourney.entry_fee || tourney.entry_fee <= 0) {
    el.innerHTML = '';
    return;
  }

  const cfg = await API.get(`/api/tournaments/${tid}/payment`);

  el.innerHTML = `
    <div class="pay-info">
      <b style="color:var(--orange)">ENTRY FEE: ₹${tourney.entry_fee}</b><br>
      Choose a payment method below. Your registration will be marked <b>pending</b> until the admin verifies your payment.
    </div>

    <div class="form-group">
      <label>Payment Method</label>
      <div class="type-picker" id="payPicker">
        <button type="button" data-pay="upi">📱 UPI</button>
        <button type="button" data-pay="cash">💵 Cash</button>
      </div>
      <input type="hidden" id="payment_method" value="">
    </div>

    <div id="payDetails"></div>
  `;

  document.getElementById('payPicker').addEventListener('click', e => {
    const b = e.target.closest('button[data-pay]');
    if (!b) return;
    document.querySelectorAll('#payPicker button').forEach(x =>
      x.classList.toggle('active', x.dataset.pay === b.dataset.pay));
    document.getElementById('payment_method').value = b.dataset.pay;
    renderPayDetails(b.dataset.pay, cfg);
  });
}

function renderPayDetails(method, cfg) {
  const el = document.getElementById('payDetails');
  if (method === 'upi') {
    el.innerHTML = `
      <div class="pay-qr">
        ${cfg.upi_qr
          ? `<img src="${cfg.upi_qr}" alt="UPI QR" onerror="this.parentElement.innerHTML='<div style=\\'color:#000;font-size:12px;padding:20px\\'>QR not uploaded yet</div>'">`
          : `<div style="color:#000;font-size:12px;padding:20px">Admin has not uploaded QR yet</div>`}
        ${cfg.upi_id ? `<div class="upi-id">UPI ID: ${esc(cfg.upi_id)}</div>` : ''}
      </div>
      <div class="pay-info">
        Scan the QR or pay to the UPI ID above.<br>
        Amount: <b>₹${currentTournament.entry_fee}</b><br>
        After paying, upload a screenshot below (or paste your UPI reference number).
      </div>
      <div class="form-group">
        <label>Payment Screenshot (required if no ref note)</label>
        <input type="file" id="payment_proof" accept="image/png,image/jpeg,image/webp,image/gif">
      </div>
      <div class="form-group">
        <label>UPI Reference / UTR (optional)</label>
        <input id="payment_note" maxlength="80" placeholder="e.g. 4012xxxxxx">
      </div>
    `;
  } else if (method === 'cash') {
    el.innerHTML = `
      <div class="pay-info">
        <b>Cash Payment</b><br>
        ${cfg.cash_instructions
          ? esc(cfg.cash_instructions).replace(/\n/g,'<br>')
          : 'Pay the entry fee in person to the tournament admin.'}<br><br>
        Amount: <b>₹${currentTournament.entry_fee}</b><br>
        After paying, register below. The admin will verify your payment manually.
      </div>
      <div class="form-group">
        <label>Note (optional)</label>
        <input id="payment_note" maxlength="80" placeholder="e.g. Paid to Rahul on 25th">
      </div>
    `;
  } else {
    el.innerHTML = '';
  }
}

async function submit(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Registering…';

  try {
    const type = document.getElementById('type').value;
    const count = { solo: 1, duo: 2, squad: 4 }[type];
    const players = [];
    for (let i = 0; i < count; i++) {
      const name = document.querySelector(`input[data-i="${i}"][data-f="name"]`).value.trim();
      const uid = document.querySelector(`input[data-i="${i}"][data-f="uid"]`).value.trim();
      if (!name || !uid) throw new Error('All player names and UIDs are required');
      players.push({ name, uid });
    }

    const fee = currentTournament.entry_fee || 0;
    const methodEl = document.getElementById('payment_method');
    const method = methodEl ? methodEl.value : '';

    if (fee > 0 && !method) {
      throw new Error('Please select a payment method (UPI or Cash)');
    }

    const fd = new FormData();
    fd.append('tournament_id', document.getElementById('tournament_id').value);
    fd.append('name', document.getElementById('teamName').value.trim());
    fd.append('type', type);
    fd.append('contact', document.getElementById('contact').value.trim());
    fd.append('players', JSON.stringify(players));
    if (method) fd.append('payment_method', method);

    const noteEl = document.getElementById('payment_note');
    if (noteEl && noteEl.value.trim()) fd.append('payment_note', noteEl.value.trim());

    const logo = document.getElementById('logo').files[0];
    if (logo) fd.append('logo', logo);

    const proofEl = document.getElementById('payment_proof');
    if (proofEl && proofEl.files[0]) fd.append('payment_proof', proofEl.files[0]);

    const r = await API.postForm('/api/teams/register', fd);
    const msg = fee > 0
      ? '✓ Registered! Awaiting payment + team verification by admin.'
      : '✓ Team registered! Awaiting admin approval.';
    toast(msg);
    setTimeout(() => location.href = '/team/' + r.team_id, 1400);
  } catch (err) {
    toast(err.message, true);
    btn.disabled = false;
    btn.textContent = 'Register Team';
  }
}

load();
</script>
</body>
</html>
