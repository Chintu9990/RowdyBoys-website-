<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teams · ROWDY BOYS</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="container">
  <h1 class="page-title">Teams</h1>
  <p class="page-sub">All registered teams</p>

  <div class="card" style="margin-bottom:18px">
    <div class="grid grid-3" style="gap:10px">
      <input id="q" placeholder="Search teams…">
      <select id="tournament_id"><option value="">All tournaments</option></select>
      <select id="type">
        <option value="">All types</option>
        <option value="solo">Solo</option>
        <option value="duo">Duo</option>
        <option value="squad">Squad</option>
      </select>
    </div>
  </div>

  <div id="list">Loading…</div>
  <div id="pager" style="margin-top:18px;display:flex;gap:8px;justify-content:center"></div>
</main>

<script src="/js/common.js"></script>
<script>
renderNav('/teams');
renderFooter();

let page = 1;

async function loadTournaments() {
  const t = await API.get('/api/tournaments');
  const sel = document.getElementById('tournament_id');
  t.forEach(x => sel.innerHTML += `<option value="${x.id}">${esc(x.name)}</option>`);
}

async function load() {
  const list = document.getElementById('list');
  list.innerHTML = loadingHTML();
  const params = new URLSearchParams({ status: 'approved', page, limit: 30 });
  const q = document.getElementById('q').value.trim();
  const tid = document.getElementById('tournament_id').value;
  const ty = document.getElementById('type').value;
  if (q) params.set('q', q);
  if (tid) params.set('tournament_id', tid);
  if (ty) params.set('type', ty);

  try {
    const data = await API.get('/api/teams?' + params);
    if (!data.teams.length) {
      list.innerHTML = emptyHTML('👥','NO TEAMS FOUND','Try adjusting filters.');
      document.getElementById('pager').innerHTML = '';
      return;
    }
    list.innerHTML = `<div class="grid grid-3">${data.teams.map(t => `
      <div class="team-card">
        <div class="team-card-head">
          <img class="team-logo" src="${t.logo||'/img/default-logo.svg'}" onerror="this.src='/img/default-logo.svg'">
          <div>
            <div class="team-name">${esc(t.name)}</div>
            <div class="team-meta">${esc(t.type.toUpperCase())} · ${esc(t.tournament_name||'')}</div>
          </div>
        </div>
        <div class="team-players-list">
          ${t.players.map(p => `<span><b>${esc(p.name)}</b></span>`).join('')}
        </div>
        <a class="btn btn-ghost btn-sm" href="/team/${t.id}">View Team →</a>
      </div>`).join('')}</div>`;

    const totalPages = Math.ceil(data.total / data.limit);
    document.getElementById('pager').innerHTML = totalPages > 1 ? `
      <button class="btn btn-ghost btn-sm" ${page<=1?'disabled':''} onclick="goPage(${page-1})">← Prev</button>
      <span style="padding:8px 12px;font-size:13px;color:var(--muted)">Page ${page} / ${totalPages}</span>
      <button class="btn btn-ghost btn-sm" ${page>=totalPages?'disabled':''} onclick="goPage(${page+1})">Next →</button>
    ` : '';
  } catch (e) {
    list.innerHTML = emptyHTML('⚠️','Failed to load', e.message);
  }
}

function goPage(p) { page = p; load(); window.scrollTo({top:0,behavior:'smooth'}); }

['q','tournament_id','type'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => { page=1; clearTimeout(window._t); window._t=setTimeout(load,300); });
  document.getElementById(id).addEventListener('change', () => { page=1; load(); });
});

(async () => { await loadTournaments(); load(); })();
</script>
</body>
</html>
